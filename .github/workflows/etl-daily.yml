name: ETL Diario EPL CAS

on:
  schedule:
    - cron: '0 12 * * *'   # 12:00 UTC ≈ 07:00 Monterrey, diario
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar ETL → PRODUCCIÓN
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ZENPUT_TOKEN: ${{ secrets.ZENPUT_TOKEN }}
        run: python etl_sync.py

      # Espejo en STAGING: misma corrida, otra base. Si falla NO afecta a producción
      # (continue-on-error) y solo corre si el secreto existe.
      - name: Ejecutar ETL → STAGING (espejo)
        if: ${{ env.HAS_STAGING == 'true' }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          ZENPUT_TOKEN: ${{ secrets.ZENPUT_TOKEN }}
        run: python etl_sync.py
    env:
      HAS_STAGING: ${{ secrets.DATABASE_URL_STAGING != '' }}
