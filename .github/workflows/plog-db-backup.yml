name: PLOG DB Backup (off-site, cifrado)

on:
  schedule:
    - cron: '0 8 * * *'        # 08:00 UTC ≈ 02:00 Monterrey, diario
  workflow_dispatch: {}

permissions:
  contents: write               # para publicar el respaldo mensual como Release

env:
  PLOG_BACKUP_URL: https://plog-web-production.up.railway.app/api/admin/backup

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar respaldo (pg_dump vía endpoint interno de plog-web)
        env:
          BACKUP_TOKEN: ${{ secrets.PLOG_BACKUP_TOKEN }}
        run: |
          curl -fsS --max-time 300 -H "X-Backup-Token: $BACKUP_TOKEN" \
               "$PLOG_BACKUP_URL" -o plog.sql.gz
          # Verificar que es un gzip válido y trae tablas (no un error truncado)
          test -s plog.sql.gz
          gzip -t plog.sql.gz
          zcat plog.sql.gz | grep -q "CREATE TABLE"
          echo "Respaldo OK: $(du -h plog.sql.gz | cut -f1)"

      - name: Cifrar (AES256)
        env:
          GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --cipher-algo AES256 -c plog.sql.gz
          mv plog.sql.gz.gpg "plog-$(date +%Y%m%d).sql.gz.gpg"

      - name: Respaldo permanente (Release — NO expira)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Un Release por mes que acumula los respaldos diarios cifrados. Los
          # Releases de GitHub NO expiran (a diferencia de los artifacts, tope 90d).
          TAG="backup-$(date +%Y-%m)"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              -t "Respaldos PLOG $(date +%Y-%m)" \
              -n "Respaldos diarios cifrados (AES256) del esquema plog. No expiran. Descifrar con la passphrase resguardada."
          gh release upload "$TAG" plog-*.sql.gz.gpg --clobber
          echo "Respaldo permanente subido al Release $TAG"

      - name: Copia rápida (artifact, 90 días — acceso inmediato)
        uses: actions/upload-artifact@v4
        with:
          name: plog-backup-${{ github.run_id }}
          path: plog-*.sql.gz.gpg
          retention-days: 90
